# Cross-Account Inconsistency Detector - default (full) configuration.
# Every model name, path and threshold lives here; nothing is hardcoded in the code.
seed: 42
device: auto                  # auto (GPU if available) | cpu

paths:
  pheme_v2: data/raw/pheme_v2/all-rnr-annotated-threads   # 9 events, veracity annotations
  pheme_v1: data/raw/pheme_v1/pheme-rnr-dataset            # 5 events, fallback (no veracity)
  multinli: data/raw/multinli_1.0/multinli_1.0
  pheme_rte: data/raw/pheme_rte_datasets_2016/per_event_splits   # labelled tweet pairs
  pheme_rte_splits: data/raw/pheme_rte_datasets_2016/test_training_splits  # leave-one-event-out
  finetuned_dir: models/finetuned   # fine-tuned NLI checkpoints (gitignored, under models/)
  models_dir: models          # optional local snapshots: models/<name with / replaced by __>
  cache_dir: outputs/cache    # embedding + NLI score caches
  output_dir: outputs
  figures_dir: outputs/figures

events:
  main: [ottawashooting, sydneysiege, charliehebdo, germanwings-crash]
  extra: [ferguson]

data:
  include_replies: false      # main experiments use source tweets (one account = one report)
  languages: [en]             # tweets whose Twitter `lang` is not listed are dropped; [] keeps all
  min_tokens: 4               # drop cleaned tweets shorter than this
  dedup: true                 # drop exact duplicates of the normalised text (keep earliest)
  max_claims_per_event: null  # null = no cap
  # --- pasted / free-text accounts only (PHEME tweets are not split)
  sentence_splitter: abbrev   # abbrev (not after Dr. St. approx. ...) | simple (split after every . ! ?)
  max_claim_words: 40         # split longer sentences into clauses so a pair fits nli.max_length; null = never

models:
  nli: cross-encoder/nli-deberta-v3-base
  nli_comparison: roberta-large-mnli            # optional; skipped unless --compare-nli
  embedding: sentence-transformers/all-MiniLM-L6-v2
  embedding_comparison: sentence-transformers/all-mpnet-base-v2
  embedding_multilingual: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  mock: false                 # true = deterministic mock models (tests / offline)

nli:
  batch_size: 64
  max_length: 128
  aggregation: min_contradiction   # combine the two directions: max_contradiction | min_contradiction | mean
  fp16: true                       # only used on GPU
  ground_speaker: true             # pasted accounts: "I"/"my"/"we" -> the account's name before NLI
                                   # (pipeline/grounding.py; "I heard/saw X" -> "X")

clustering:
  algorithm: agglomerative         # hdbscan | kmeans | agglomerative | graph
  hdbscan: {min_cluster_size: 3, min_samples: 2, umap_dim: 10}
  kmeans: {k_min: 5, k_max: 60, k_step: 5}
  agglomerative: {distance_threshold: 0.45, linkage: average}
  graph: {knn: 10, min_similarity: 0.55, resolution: 1.0}
  noise_strategy: nearest          # nearest | keep  (what to do with unclustered points)
  noise_assign_min_sim: 0.6        # 'nearest' only attaches a noise point above this cosine sim
  min_cluster_size_for_pairs: 2
  label_top_terms: 5

disagreement:
  contradiction_threshold: 0.9     # a pair "contradicts" at or above this probability
  min_contradicting_pairs: 1       # cluster is flagged with at least this many such pairs
  score_weight_fraction: 0.5       # score = w*fraction_contradicting + (1-w)*max_contradiction
  max_pairs_per_cluster: 400       # seeded random sample above this, to bound NLI cost
  cross_account_only: true         # never compare an account with itself
  top_pairs_in_report: 10

checks:                            # post-NLI checks (pipeline/pair_checks.py): set aside flagged
  enabled: true                    # pairs that match a known non-contradiction pattern
  same_quantity: true              # "about 30 mph" / "about 50 km/h"; "about 20" / "around 25 people"
  non_observation: true            # "I didn't see a gun" against "he had a gun"
  reported_speech: true            # "the driver told me he had stopped" against "he did not stop"
  different_time: true             # "alive when I got there" / "dead when the ambulance arrived"
  different_referent: true         # "the cyclist" / "the pedestrian"; each witness's own "my car"

findings:                          # the "what accounts agree on / conflict on" summary
  entailment_threshold: 0.8        # another account "restates" a claim at or above this

evaluation:
  mnli_max_examples: null          # null = full validation sets
  proxy_pairs_per_class: 400
  threshold_grid: [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.98, 0.99]
  aggregations: [max_contradiction, mean, min_contradiction]   # ablation on the default config
  allpairs_max_claims: 350         # all-pairs baseline is run on at most this many claims/event
  error_examples: 20
  bootstrap_samples: 2000          # story-group / cluster bootstrap resamples (evaluation/validity.py)

finetune:                          # NLI fine-tuning on PHEME RTE (training/finetune_nli.py)
  # --- use in the pipeline / Streamlit app
  use_finetuned: false             # true = replace models.nli by the checkpoint below
  checkpoint: nli-deberta-v3-base-pheme-all   # folder under paths.finetuned_dir
  operating_mode: best_f1          # best_f1 | recall_at_precision: which saved operating point to use
  aggregation_override: min_contradiction   # null = use the saved rule. min: both directions must
                                   # say contradiction (fewer false alarms, lower recall; see REPORT 6.10)
  # --- training
  folds: [germanwings-crash, sydneysiege, ottawashooting, charliehebdo]   # held-out events
  lr: 2.0e-5
  epochs: 3
  batch_size: 16
  eval_batch_size: 64
  max_length: 128
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true                       # only used on GPU
  both_directions: true            # train on (A,B) and (B,A) with the same label
  imbalance: weighted_loss         # weighted_loss (inverse frequency) | sampler (WeightedRandomSampler) | none
  mnli_replay: 3000                # random MultiNLI examples mixed into training; 0 disables
  mnli_split: train                # train | dev_matched | dev_mismatched (local jsonl, never downloaded)
  validation: held_out_event       # held_out_event | pairs (see below)
  # held_out_event: validate on one whole training event (the next event after the held-out one
  #   in `folds`, cyclically) and train on the other two. Tweets and rumour stories repeat
  #   heavily inside an event, so a random pair split leaks and saturates (val AP ~1.0).
  # pairs: val_fraction of the train pairs, stratified by label, grouped by text pair.
  val_fraction: 0.1
  early_stopping_metric: contradiction_ap   # contradiction_ap | contradiction_f1 (on validation)
  early_stopping_patience: 1       # epochs without improvement before stopping
  operating_point:
    aggregations: [max_contradiction, mean, min_contradiction]
    fine_grid: {start: 0.05, stop: 0.99, step: 0.01}   # added to evaluation.threshold_grid
    min_precision: 0.55            # recall_at_precision: highest recall with precision >= this
  pipeline_eval_algorithm: agglomerative   # clustering used for the "pipeline on labelled pairs" view
  max_train_pairs: null            # cap for quick runs (sample config); null = all
  max_test_pairs: null
