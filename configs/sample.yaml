# Overrides for `--sample`: small subset that runs end to end in minutes on a laptop CPU.
events:
  main: [ottawashooting, germanwings-crash]
  extra: []
data:
  max_claims_per_event: 60
nli:
  batch_size: 16
clustering:
  kmeans: {k_min: 3, k_max: 15, k_step: 3}
disagreement:
  max_pairs_per_cluster: 60
evaluation:
  mnli_max_examples: 150
  proxy_pairs_per_class: 40
  allpairs_max_claims: 40
  error_examples: 10
paths:
  finetuned_dir: outputs/sample/finetuned   # never overwrite the real checkpoints
finetune:
  max_train_pairs: 300
  max_test_pairs: 200
  epochs: 1
  mnli_replay: 100
